<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재고관리 | 리브가전 관리자</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --main:#172033; --sub:#39445A; --bg:#F7F8FA; --point:#C83D3D;
    --text:#171717; --gray:#E9EBEF; --white:#FFFFFF; --muted:#7C8398;
    --radius:3px; --sidebar-w:230px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard','Noto Sans KR',sans-serif; color:var(--text); background:var(--bg); line-height:1.5;}
  img,svg{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}

  .admin-shell{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh;}
  .sidebar{background:var(--main); color:var(--white); padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .sidebar-logo{font-size:18px; font-weight:800; padding:0 24px 24px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:12px;}
  .sidebar-logo span{color:#F0A8A8;}
  .sidebar-logo small{display:block; font-size:11px; font-weight:500; color:#9AA1B4; margin-top:4px;}
  .nav-group{margin-bottom:6px;}
  .nav-group-label{font-size:11px; color:#7C839E; padding:14px 24px 6px; letter-spacing:0.02em;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:11px 24px; font-size:13.5px; font-weight:500; color:#C7CCDA;}
  .nav-item svg{width:17px; height:17px; flex-shrink:0;}
  .nav-item.active{background:rgba(255,255,255,0.08); color:var(--white); font-weight:700; border-right:3px solid #F0A8A8;}
  .nav-item:hover{color:var(--white);}

  .main{padding:28px 32px 60px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .topbar h1{font-size:22px; font-weight:800;}

  .alert-banner{
    display:flex; align-items:center; gap:10px; background:#FDEDED; border:1px solid #F4D4D4; color:var(--point);
    border-radius:var(--radius); padding:13px 18px; font-size:13px; font-weight:600; margin-bottom:18px;
  }
  .alert-banner svg{width:18px; height:18px; flex-shrink:0;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
  .stat-card{background:var(--white); border:1px solid var(--gray); border-radius:var(--radius); padding:18px 20px;}
  .stat-card .label{font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:8px;}
  .stat-card .value{font-size:22px; font-weight:800;}
  .stat-card.warn .value{color:var(--point);}

  .filter-bar{background:var(--white); border:1px solid var(--gray); border-radius:var(--radius); padding:16px 20px; margin-bottom:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .filter-bar input, .filter-bar select{padding:9px 12px; border:1px solid var(--gray); border-radius:var(--radius); font-size:13px; font-family:inherit;}
  .filter-bar input[type=text]{flex:1; min-width:200px;}
  .status-tabs{display:flex; gap:6px;}
  .status-tab{padding:9px 14px; font-size:12.5px; font-weight:600; color:var(--muted); border:1px solid var(--gray); border-radius:99px;}
  .status-tab.active{background:var(--main); color:var(--white); border-color:var(--main);}

  .table-card{background:var(--white); border:1px solid var(--gray); border-radius:var(--radius); overflow-x:auto;}
  table{width:100%; border-collapse:collapse;}
  th, td{text-align:left; padding:12px 14px; font-size:13px; border-bottom:1px solid var(--gray); white-space:nowrap;}
  th{background:var(--bg); color:var(--muted); font-weight:600; font-size:12px;}
  tr:last-child td{border-bottom:none;}
  .p-thumb{width:40px; height:40px; background:var(--bg); border:1px solid var(--gray); border-radius:2px; display:flex; align-items:center; justify-content:center;}
  .p-thumb svg{width:60%; height:60%; color:var(--sub);}
  .p-name-cell{display:flex; align-items:center; gap:10px;}
  .p-name{font-weight:600; max-width:200px; white-space:normal;}
  .p-opt{font-size:11px; color:var(--muted);}
  .stock-input{width:70px; padding:7px 8px; border:1px solid var(--gray); border-radius:var(--radius); font-size:13px; font-family:inherit; text-align:center;}
  .stock-low{color:var(--point); font-weight:700;}
  .badge{font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px;}
  .badge-green{background:#EDF3EC; color:#2F7A45;}
  .badge-red{background:#FDEDED; color:var(--point);}
  .badge-gray{background:var(--gray); color:var(--muted);}
  .row-actions{display:flex; gap:6px;}
  .row-actions button{padding:6px 11px; border:1px solid var(--gray); border-radius:var(--radius); font-size:11.5px; font-weight:600; color:var(--sub);}
  .row-actions button.primary{background:var(--main); color:var(--white); border-color:var(--main);}
  .row-actions button.danger{color:var(--point); border-color:#F4D4D4;}

  @media (max-width:900px){
    .admin-shell{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">리브<span>가전</span><small>관리자 시스템</small></div>
    <div class="nav-group">
      <a class="nav-item" href="admin-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="12" width="8" height="9" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>
        대시보드
      </a>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">상품</div>
      <a class="nav-item" href="admin-products.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
        상품관리
      </a>
      <a class="nav-item" href="admin-category.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="1.5"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        카테고리관리
      </a>
      <a class="nav-item active" href="admin-inventory.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        재고관리
      </a>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">주문/배송</div>
      <a class="nav-item" href="admin-orders.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h2l2 11h10l2-8H7"/></svg>
        주문관리
      </a>
      <a class="nav-item" href="admin-orders.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="1" y="7" width="14" height="10" rx="1.5"/><path d="M15 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="18" cy="19" r="1.6"/></svg>
        배송관리
      </a>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">고객</div>
      <a class="nav-item" href="admin-customers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-5.6 7-5.6S17.8 16 19 20"/></svg>
        회원관리
      </a>
      <a class="nav-item" href="admin-customers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l1.6 4.9H19l-4.2 3 1.6 4.9-4.4-3.1-4.4 3.1 1.6-4.9L5 7.9h5.4z"/></svg>
        리뷰관리
      </a>
      <a class="nav-item" href="admin-customers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v12H8l-4 4z"/></svg>
        문의관리
      </a>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">프로모션</div>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12l9-9 9 9-9 9z"/><circle cx="12" cy="12" r="2"/></svg>
        쿠폰관리
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="1.5"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
        메인배너관리
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><h1>재고관리</h1></div>

    <div class="alert-banner" id="alertBanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      재고가 안전재고 이하인 상품이 <b id="lowCount">0</b>건 있습니다. 빠른 입고 처리가 필요합니다.
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="label">전체 재고 수량</div><div class="value" id="totalStock">0개</div></div>
      <div class="stat-card warn"><div class="label">안전재고 이하</div><div class="value" id="lowStockStat">0개</div></div>
      <div class="stat-card"><div class="label">품절 상품</div><div class="value" id="soldoutStat">0개</div></div>
      <div class="stat-card"><div class="label">이번 주 판매수량</div><div class="value">216개</div></div>
    </div>

    <div class="filter-bar">
      <input type="text" placeholder="상품명 / 옵션 검색">
      <select>
        <option>카테고리 전체</option>
        <option>냉장고</option><option>세탁/건조</option><option>TV</option><option>주방가전</option><option>생활가전</option>
      </select>
      <div class="status-tabs" id="stockTabs">
        <button class="status-tab active" data-s="all">전체</button>
        <button class="status-tab" data-s="low">안전재고 이하</button>
        <button class="status-tab" data-s="soldout">품절</button>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr><th>상품</th><th>옵션</th><th>현재재고</th><th>판매수량</th><th>입고예정</th><th>안전재고</th><th>상태</th><th>재고수정</th><th></th></tr>
        </thead>
        <tbody id="stockTbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
const fridgeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="2" width="14" height="20" rx="1.5"/><line x1="5" y1="10" x2="19" y2="10"/></svg>`;
const laundryIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="5"/></svg>`;
const tvIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><line x1="8" y1="21" x2="16" y2="21"/></svg>`;
const kitchenIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12c0-4 3.5-7 8-7s8 3 8 7"/><rect x="3" y="12" width="18" height="8" rx="1.5"/></svg>`;

let stockItems = [
  {id:1, name:'BESPOKE 냉장고 4도어 875L', opt:'화이트 / 875L', icon:fridgeIcon, stock:24, sold:32, incoming:0, safe:5, edited:false},
  {id:2, name:'BESPOKE 냉장고 4도어 875L', opt:'네이비 / 875L', icon:fridgeIcon, stock:4, sold:11, incoming:20, safe:5, edited:false},
  {id:3, name:'오브제컬렉션 세탁건조기 21kg', opt:'베이지', icon:laundryIcon, stock:3, sold:21, incoming:10, safe:5, edited:false},
  {id:4, name:'Neo QLED 4K TV 65형', opt:'스탠드형', icon:tvIcon, stock:14, sold:27, incoming:0, safe:5, edited:false},
  {id:5, name:'퓨리케어 공기청정기 360°', opt:'화이트', icon:kitchenIcon, stock:0, sold:18, incoming:15, safe:5, edited:false},
  {id:6, name:'트롬 건조기 히트펌프 21kg', opt:'화이트', icon:laundryIcon, stock:2, sold:9, incoming:0, safe:5, edited:false},
  {id:7, name:'비스포크 광파오븐', opt:'블랙', icon:kitchenIcon, stock:31, sold:14, incoming:0, safe:5, edited:false},
];

function renderStats(){
  const total = stockItems.reduce((s,i)=>s+i.stock,0);
  const low = stockItems.filter(i=>i.stock>0 && i.stock<=i.safe).length;
  const soldout = stockItems.filter(i=>i.stock===0).length;
  document.getElementById('totalStock').textContent = total.toLocaleString('ko-KR')+'개';
  document.getElementById('lowStockStat').textContent = low+'개';
  document.getElementById('soldoutStat').textContent = soldout+'개';
  document.getElementById('lowCount').textContent = low+soldout;
  document.getElementById('alertBanner').style.display = (low+soldout)>0 ? 'flex' : 'none';
}

function statusOf(item){
  if(item.stock===0) return {label:'품절', cls:'badge-red'};
  if(item.stock<=item.safe) return {label:'안전재고 이하', cls:'badge-red'};
  return {label:'정상', cls:'badge-green'};
}

function renderStock(filter='all'){
  let list = stockItems;
  if(filter==='low') list = list.filter(i=>i.stock>0 && i.stock<=i.safe);
  if(filter==='soldout') list = list.filter(i=>i.stock===0);

  document.getElementById('stockTbody').innerHTML = list.map(item=>{
    const st = statusOf(item);
    return `
    <tr data-id="${item.id}">
      <td>
        <div class="p-name-cell">
          <div class="p-thumb">${item.icon}</div>
          <div class="p-name">${item.name}</div>
        </div>
      </td>
      <td class="p-opt">${item.opt}</td>
      <td class="${item.stock<=item.safe ? 'stock-low':''}">${item.stock}개</td>
      <td>${item.sold}개</td>
      <td>${item.incoming>0 ? item.incoming+'개' : '-'}</td>
      <td>${item.safe}개</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td><input type="text" class="stock-input" value="${item.stock}" inputmode="numeric" onchange="markEdited(${item.id}, this.value)"></td>
      <td>
        <div class="row-actions">
          <button class="primary" onclick="applyStock(${item.id})">적용</button>
          ${item.stock>0 ? `<button class="danger" onclick="setSoldout(${item.id})">품절처리</button>` : `<button onclick="restockToSafe(${item.id})">재입고</button>`}
        </div>
      </td>
    </tr>
  `;
  }).join('');
}
renderStats();
renderStock();

let pendingEdits = {};
function markEdited(id, val){
  pendingEdits[id] = parseInt(val) || 0;
}
function applyStock(id){
  const item = stockItems.find(x=>x.id===id);
  if(pendingEdits[id] !== undefined){
    item.stock = pendingEdits[id];
    delete pendingEdits[id];
  }
  renderStats();
  renderStock(document.querySelector('.status-tab.active').dataset.s);
  alert('재고가 수정되었습니다.');
}
function setSoldout(id){
  if(!confirm('해당 옵션을 품절 처리하시겠습니까?')) return;
  const item = stockItems.find(x=>x.id===id);
  item.stock = 0;
  renderStats();
  renderStock(document.querySelector('.status-tab.active').dataset.s);
}
function restockToSafe(id){
  const item = stockItems.find(x=>x.id===id);
  item.stock = item.safe + 10;
  renderStats();
  renderStock(document.querySelector('.status-tab.active').dataset.s);
  alert('재입고 처리되어 재고가 반영되었습니다.');
}

document.getElementById('stockTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.status-tab');
  if(!btn) return;
  document.querySelectorAll('.status-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderStock(btn.dataset.s);
});
</script>
</body>
</html>
