<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문/결제 | 리브가전</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  :root{
    --main:#172033; --sub:#39445A; --bg:#F7F8FA; --point:#C83D3D;
    --text:#171717; --gray:#E9EBEF; --white:#FFFFFF; --muted:#7C8398;
    --radius:3px; --maxw:1080px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard','Noto Sans KR',sans-serif; color:var(--text); background:var(--white); line-height:1.5;}
  img,svg{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}

  header.site-header{border-bottom:1px solid var(--gray);}
  .header-inner{max-width:1240px; margin:0 auto; padding:0 24px; height:72px; display:flex; align-items:center; justify-content:center;}
  .logo{font-size:22px; font-weight:800; letter-spacing:-0.03em; color:var(--main);}
  .logo span{color:var(--point);}

  .page-head{padding:32px 0 8px;}
  .page-head h1{font-size:24px; font-weight:800;}

  .checkout-layout{display:grid; grid-template-columns:1fr 320px; gap:32px; align-items:start; padding:24px 0 80px;}

  .block{border-top:2px solid var(--main); padding-top:18px; margin-bottom:36px;}
  .block h2{font-size:16px; font-weight:800; margin-bottom:16px;}

  .order-item{display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--gray);}
  .order-item:last-child{border-bottom:none;}
  .item-thumb{width:64px; height:64px; background:var(--bg); border:1px solid var(--gray); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .item-thumb svg{width:50%; height:50%; color:var(--sub);}
  .item-name{font-size:14px; font-weight:600; margin-bottom:4px;}
  .item-option{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .item-qty-price{font-size:13px; color:var(--sub);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--sub); margin-bottom:8px;}
  .field input, .field textarea, .field select{
    width:100%; padding:12px 14px; border:1px solid var(--gray); border-radius:var(--radius);
    font-size:14px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .zip-row{display:flex; gap:8px;}
  .zip-row input{flex:1;}
  .zip-row button{padding:0 16px; border:1px solid var(--gray); border-radius:var(--radius); font-size:13px; font-weight:600; color:var(--sub); white-space:nowrap;}

  .saved-address{display:flex; gap:8px; margin-bottom:14px;}
  .saved-address select{flex:1;}

  .pay-methods{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .pay-method{border:1px solid var(--gray); border-radius:var(--radius); padding:14px; text-align:center; font-size:13px; font-weight:600; color:var(--sub); cursor:pointer;}
  .pay-method.selected{border-color:var(--main); background:var(--main); color:var(--white);}

  /* Summary */
  .summary-box{border:1px solid var(--gray); border-radius:var(--radius); padding:24px; position:sticky; top:24px;}
  .summary-box h3{font-size:16px; font-weight:800; margin-bottom:18px;}
  .summary-row{display:flex; justify-content:space-between; font-size:14px; color:var(--sub); margin-bottom:12px;}
  .summary-row.discount span:last-child{color:var(--point); font-weight:600;}
  .summary-divider{border-top:1px solid var(--gray); margin:14px 0;}
  .summary-total{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px;}
  .summary-total span:first-child{font-size:15px; font-weight:700;}
  .summary-total span:last-child{font-size:22px; font-weight:800;}
  .agree-line{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:16px;}
  .agree-line input{width:14px; height:14px; accent-color:var(--main);}
  .pay-btn{display:block; width:100%; text-align:center; padding:16px; background:var(--main); color:var(--white); border-radius:var(--radius); font-size:15px; font-weight:700;}

  /* Complete */
  .complete-view{display:none; max-width:520px; margin:0 auto; padding:80px 24px; text-align:center;}
  .complete-view svg{width:60px; height:60px; color:var(--main); margin:0 auto 22px;}
  .complete-view h2{font-size:22px; font-weight:800; margin-bottom:10px;}
  .complete-view p{font-size:14px; color:var(--muted); margin-bottom:28px;}
  .order-number-box{background:var(--bg); border-radius:var(--radius); padding:18px; margin-bottom:28px;}
  .order-number-box div:first-child{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .order-number-box div:last-child{font-size:18px; font-weight:800; letter-spacing:0.02em;}
  .complete-actions{display:flex; gap:10px;}
  .complete-actions a{flex:1; padding:14px; border-radius:var(--radius); font-size:14px; font-weight:700; text-align:center;}
  .complete-actions a.outline{border:1px solid var(--main); color:var(--main);}
  .complete-actions a.filled{background:var(--main); color:var(--white);}

  @media (max-width:800px){
    .checkout-layout{grid-template-columns:1fr;}
    .summary-box{position:static;}
    .field-row{flex-direction:column;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">리브<span>가전</span></a>
  </div>
</header>

<div class="wrap">

  <div id="checkoutView">
    <div class="page-head"><h1>주문/결제</h1></div>

    <div class="checkout-layout">
      <div>
        <!-- 주문상품 -->
        <div class="block">
          <h2>주문상품 (<span id="itemCount">0</span>)</h2>
          <div id="orderItemsList"></div>
        </div>

        <!-- 배송정보 -->
        <div class="block">
          <h2>배송정보</h2>
          <div class="saved-address">
            <select>
              <option>배송지를 선택해주세요</option>
              <option>[기본배송지] 서울특별시 00구 00로 00</option>
              <option>새 배송지 입력</option>
            </select>
          </div>
          <div class="field-row">
            <div class="field">
              <label>받는 사람</label>
              <input type="text" id="f_receiver" placeholder="이름">
            </div>
            <div class="field">
              <label>휴대폰번호</label>
              <input type="tel" id="f_phone" placeholder="- 없이 숫자만 입력">
            </div>
          </div>
          <div class="field">
            <label>우편번호</label>
            <div class="zip-row">
              <input type="text" id="f_zip" placeholder="우편번호">
              <button type="button" onclick="alert('우편번호 검색 화면입니다. (데모)')">우편번호 검색</button>
            </div>
          </div>
          <div class="field">
            <label>주소</label>
            <input type="text" id="f_address" placeholder="기본주소">
          </div>
          <div class="field">
            <label>상세주소</label>
            <input type="text" id="f_addressDetail" placeholder="상세주소를 입력해주세요">
          </div>
          <div class="field">
            <label>배송 요청사항</label>
            <textarea id="f_note" placeholder="예) 부재 시 경비실에 맡겨주세요"></textarea>
          </div>
        </div>

        <!-- 결제수단 -->
        <div class="block">
          <h2>결제수단</h2>
          <div class="pay-methods" id="payMethods">
            <div class="pay-method selected" data-method="card">신용/체크카드</div>
            <div class="pay-method" data-method="transfer">계좌이체</div>
            <div class="pay-method" data-method="virtual">가상계좌</div>
            <div class="pay-method" data-method="easy">간편결제</div>
          </div>
        </div>
      </div>

      <!-- 결제 요약 -->
      <div class="summary-box">
        <h3>결제 예상금액</h3>
        <div class="summary-row"><span>상품금액</span><span id="sumList">0원</span></div>
        <div class="summary-row discount"><span>할인금액</span><span id="sumDiscount">-0원</span></div>
        <div class="summary-row"><span>배송비</span><span>무료</span></div>
        <div class="summary-divider"></div>
        <div class="summary-total"><span>최종 결제금액</span><span id="sumFinal">0원</span></div>
        <label class="agree-line"><input type="checkbox" id="agreeOrder"> 주문 내용을 확인하였으며, 결제에 동의합니다.</label>
        <button class="pay-btn" id="payBtn">결제하기</button>
      </div>
    </div>
  </div>

  <!-- 주문완료 -->
  <div class="complete-view" id="completeView">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
    <h2>주문이 완료되었습니다</h2>
    <p>주문해주셔서 감사합니다. 결제 확인 후 상품 준비가 시작됩니다.</p>
    <div class="order-number-box">
      <div>주문번호</div>
      <div id="orderNumber">LV202609070001</div>
    </div>
    <div class="complete-actions">
      <a href="index.html" class="outline">쇼핑 계속하기</a>
      <a href="mypage.html" class="filled">주문 내역 보기</a>
    </div>
  </div>
</div>

<script>
const CATEGORY_ICON_MAP = {
  '냉장고': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="2" width="14" height="20" rx="1.5"/><line x1="5" y1="10" x2="19" y2="10"/></svg>`,
  '세탁/건조': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="5"/></svg>`,
  'TV': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><line x1="8" y1="21" x2="16" y2="21"/></svg>`,
};
const DEFAULT_ICON = CATEGORY_ICON_MAP['냉장고'];

function won(n){ return n.toLocaleString('ko-KR')+'원'; }

let cartIds = [];
let orderItems = []; // 화면 표시용

async function initCheckout(){
  const { data: { user } } = await window.sb.auth.getUser();
  if(!user){
    alert('로그인이 필요합니다.');
    location.href = 'auth.html';
    return;
  }

  const stored = sessionStorage.getItem('checkoutCartIds');
  cartIds = stored ? JSON.parse(stored) : [];
  if(cartIds.length === 0){
    alert('주문할 상품이 없습니다. 장바구니에서 다시 선택해주세요.');
    location.href = 'cart.html';
    return;
  }

  const { data: rows, error } = await window.sb
    .from('carts')
    .select(`
      id, qty, option_summary, unit_price,
      products ( name, list_price, categories ( name ) )
    `)
    .in('id', cartIds);

  if(error || !rows || rows.length === 0){
    alert('주문 정보를 불러오지 못했습니다.');
    location.href = 'cart.html';
    return;
  }

  orderItems = rows.map(r=>({
    name: r.products?.name || '상품',
    icon: CATEGORY_ICON_MAP[r.products?.categories?.name] || DEFAULT_ICON,
    option: r.option_summary || '기본',
    qty: r.qty,
    unitPrice: r.unit_price,
    listUnitPrice: r.products?.list_price || r.unit_price,
  }));

  renderOrderItems();

  // 프로필 정보로 받는사람/연락처 기본값 채우기
  const { data: profile } = await window.sb.from('profiles').select('name, phone').eq('id', user.id).single();
  if(profile){
    document.getElementById('f_receiver').value = profile.name || '';
    document.getElementById('f_phone').value = profile.phone || '';
  }
}

function renderOrderItems(){
  document.getElementById('itemCount').textContent = orderItems.length;
  document.getElementById('orderItemsList').innerHTML = orderItems.map(item=>`
    <div class="order-item">
      <div class="item-thumb">${item.icon}</div>
      <div>
        <div class="item-name">${item.name}</div>
        <div class="item-option">${item.option}</div>
        <div class="item-qty-price">${item.qty}개 · ${won(item.unitPrice)}</div>
      </div>
    </div>
  `).join('');

  const listSum = orderItems.reduce((s,i)=>s+i.listUnitPrice*i.qty, 0);
  const finalSum = orderItems.reduce((s,i)=>s+i.unitPrice*i.qty, 0);
  const discount = listSum - finalSum;

  document.getElementById('sumList').textContent = won(listSum);
  document.getElementById('sumDiscount').textContent = '-'+won(discount);
  document.getElementById('sumFinal').textContent = won(finalSum);
  document.getElementById('payBtn').textContent = `${won(finalSum)} 결제하기`;
}

document.getElementById('payMethods').addEventListener('click', (e)=>{
  const item = e.target.closest('.pay-method');
  if(!item) return;
  document.querySelectorAll('.pay-method').forEach(p=>p.classList.remove('selected'));
  item.classList.add('selected');
});

document.getElementById('payBtn').addEventListener('click', async ()=>{
  if(!document.getElementById('agreeOrder').checked){
    alert('주문 내용 확인 및 결제 동의가 필요합니다.');
    return;
  }
  const receiver_name = document.getElementById('f_receiver').value.trim();
  const receiver_phone = document.getElementById('f_phone').value.trim();
  const address = document.getElementById('f_address').value.trim();
  const address_detail = document.getElementById('f_addressDetail').value.trim();
  const request_note = document.getElementById('f_note').value.trim();
  const payment_method = document.querySelector('.pay-method.selected')?.dataset.method || 'card';

  if(!receiver_name || !receiver_phone || !address){
    alert('배송정보를 모두 입력해주세요.');
    return;
  }

  const payBtn = document.getElementById('payBtn');
  payBtn.disabled = true;
  payBtn.textContent = '결제 처리 중...';

  const { data: { session } } = await window.sb.auth.getSession();

  try {
    const res = await fetch('/.netlify/functions/create-order', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({
        cartIds, receiver_name, receiver_phone, address, address_detail, request_note, payment_method,
      }),
    });
    const result = await res.json();

    if(!res.ok){
      alert(result.error || '주문 처리에 실패했습니다.');
      payBtn.disabled = false;
      renderOrderItems();
      return;
    }

    sessionStorage.removeItem('checkoutCartIds');
    document.getElementById('orderNumber').textContent = result.order_no;
    document.getElementById('checkoutView').style.display = 'none';
    document.getElementById('completeView').style.display = 'block';
    window.scrollTo(0,0);
  } catch(err){
    alert('네트워크 오류로 주문에 실패했습니다. 다시 시도해주세요.');
    payBtn.disabled = false;
    renderOrderItems();
  }
});

initCheckout();
</script>
</body>
</html>
