<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원/리뷰/문의관리 | 리브가전 관리자</title>

  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<style>
  :root{
    --main:#172033; --sub:#39445A; --bg:#F7F8FA; --point:#C83D3D;
    --text:#171717; --gray:#E9EBEF; --white:#FFFFFF; --muted:#7C8398;
    --radius:3px; --sidebar-w:230px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard','Noto Sans KR',sans-serif; color:var(--text); background:var(--bg); line-height:1.5;}
  img,svg{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}

  .admin-shell{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh;}
  .sidebar{background:var(--main); color:var(--white); padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .sidebar-logo{font-size:18px; font-weight:800; padding:0 24px 24px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:12px;}
  .sidebar-logo span{color:#F0A8A8;}
  .sidebar-logo small{display:block; font-size:11px; font-weight:500; color:#9AA1B4; margin-top:4px;}
  .nav-group{margin-bottom:6px;}
  .nav-group-label{font-size:11px; color:#7C839E; padding:14px 24px 6px; letter-spacing:0.02em;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:11px 24px; font-size:13.5px; font-weight:500; color:#C7CCDA;}
  .nav-item svg{width:17px; height:17px; flex-shrink:0;}
  .nav-item.active{background:rgba(255,255,255,0.08); color:var(--white); font-weight:700; border-right:3px solid #F0A8A8;}
  .nav-item:hover{color:var(--white);}

  .main{padding:28px 32px 60px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .topbar h1{font-size:22px; font-weight:800;}

  .top-tabs{display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--gray);}
  .top-tab{padding:12px 20px; font-size:14px; font-weight:700; color:var(--muted); border-bottom:2px solid transparent;}
  .top-tab.active{color:var(--main); border-color:var(--main);}

  .view-panel{display:none;}
  .view-panel.active{display:block;}

  .filter-bar{background:var(--white); border:1px solid var(--gray); border-radius:var(--radius); padding:16px 20px; margin-bottom:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .filter-bar input, .filter-bar select{padding:9px 12px; border:1px solid var(--gray); border-radius:var(--radius); font-size:13px; font-family:inherit;}
  .filter-bar input[type=text]{flex:1; min-width:200px;}
  .sub-tabs{display:flex; gap:6px;}
  .sub-tab{padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--muted); border:1px solid var(--gray); border-radius:99px;}
  .sub-tab.active{background:var(--main); color:var(--white); border-color:var(--main);}

  .table-card{background:var(--white); border:1px solid var(--gray); border-radius:var(--radius); overflow-x:auto;}
  table{width:100%; border-collapse:collapse;}
  th, td{text-align:left; padding:13px 14px; font-size:13px; border-bottom:1px solid var(--gray); white-space:nowrap;}
  th{background:var(--bg); color:var(--muted); font-weight:600; font-size:12px;}
  tr:last-child td{border-bottom:none;}
  .cell-wrap{white-space:normal; max-width:260px;}
  .badge{font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px;}
  .badge-blue{background:#EAF0FA; color:var(--sub);}
  .badge-red{background:#FDEDED; color:var(--point);}
  .badge-green{background:#EDF3EC; color:#2F7A45;}
  .badge-gray{background:var(--gray); color:var(--muted);}
  .row-btn{padding:6px 12px; border:1px solid var(--gray); border-radius:var(--radius); font-size:11.5px; font-weight:600; color:var(--sub); margin-right:4px;}
  .row-btn.danger{color:var(--point); border-color:#F4D4D4;}
  .stars-mini{color:var(--main); font-size:12px;}

  /* Drawer (shared) */
  .drawer-backdrop{display:none; position:fixed; inset:0; background:rgba(23,32,51,0.5); z-index:200;}
  .drawer-backdrop.open{display:block;}
  .side-drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(560px,92vw); background:var(--white); z-index:210;
    transform:translateX(100%); transition:transform .2s ease; overflow-y:auto;
  }
  .side-drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; padding:20px 28px; border-bottom:1px solid var(--gray); position:sticky; top:0; background:var(--white); z-index:5;}
  .drawer-head h2{font-size:16px; font-weight:800;}
  .drawer-close{font-size:13px; color:var(--muted);}
  .drawer-body{padding:24px 28px 40px;}

  .form-section{margin-bottom:26px;}
  .form-section h3{font-size:13.5px; font-weight:800; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--main); display:inline-block;}
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; font-size:13px;}
  .info-grid div span:first-child{color:var(--muted); display:block; font-size:11.5px; margin-bottom:3px;}
  .info-grid div span:last-child{font-weight:600;}

  .mini-order-item{display:flex; justify-content:space-between; font-size:12.5px; padding:9px 0; border-bottom:1px dashed var(--gray);}
  .mini-order-item:last-child{border-bottom:none;}

  .grade-pills, .state-pills{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{padding:9px 14px; border:1px solid var(--gray); border-radius:var(--radius); font-size:12.5px; font-weight:600; color:var(--sub);}
  .pill.selected{background:var(--main); color:var(--white); border-color:var(--main);}

  .review-full-text{background:var(--bg); border-radius:var(--radius); padding:16px; font-size:13.5px; margin-bottom:20px; line-height:1.7;}

  .answer-box textarea{width:100%; min-height:100px; padding:12px 14px; border:1px solid var(--gray); border-radius:var(--radius); font-size:13.5px; font-family:inherit; resize:vertical;}

  .drawer-foot{position:sticky; bottom:0; background:var(--white); border-top:1px solid var(--gray); padding:16px 28px; display:flex; gap:10px; justify-content:flex-end;}
  .btn-cancel{padding:11px 20px; border:1px solid var(--gray); border-radius:var(--radius); font-size:13px; font-weight:600; color:var(--sub);}
  .btn-save{padding:11px 24px; background:var(--main); color:var(--white); border-radius:var(--radius); font-size:13px; font-weight:700;}

  @media (max-width:900px){
    .admin-shell{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .info-grid{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
function won(n){ return (n||0).toLocaleString('ko-KR')+'원'; }
const stateBadge = {'정상':'badge-green','휴면':'badge-gray','탈퇴':'badge-red'};

function openDrawer(name){
  document.getElementById(name+'Drawer').classList.add('open');
  document.getElementById(name+'Backdrop').classList.add('open');
}
function closeDrawer(name){
  document.getElementById(name+'Drawer').classList.remove('open');
  document.getElementById(name+'Backdrop').classList.remove('open');
}
['member','review','answer'].forEach(n=>{
  document.getElementById(n+'Backdrop').addEventListener('click', ()=>closeDrawer(n));
});

// ---------- Top tabs ----------
document.getElementById('topTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.top-tab');
  if(!btn) return;
  document.querySelectorAll('.top-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view-panel').forEach(p=>p.classList.toggle('active', p.id==='view-'+btn.dataset.v));
});

// ======================================================
// 회원관리
// ======================================================
let members = [];
let ordersByUser = {};

async function loadMembers(){
  const { data: profileRows } = await window.sb
    .from('profiles')
    .select('id, name, phone, grade, points, state, created_at')
    .order('created_at', { ascending:false });

  const { data: orderRows } = await window.sb
    .from('orders')
    .select('id, order_no, user_id, final_amount, status, created_at')
    .order('created_at', { ascending:false });

  ordersByUser = {};
  (orderRows||[]).forEach(o=>{
    if(!ordersByUser[o.user_id]) ordersByUser[o.user_id] = [];
    ordersByUser[o.user_id].push(o);
  });

  members = (profileRows||[]).map(p=>{
    const userOrders = ordersByUser[p.id] || [];
    return {
      id: p.id,
      name: p.name || '(이름 미입력)',
      phone: p.phone || '-',
      join: p.created_at ? p.created_at.slice(0,10).replace(/-/g,'.') : '',
      orders: userOrders.length,
      total: userOrders.reduce((s,o)=>s+(o.final_amount||0),0),
      grade: p.grade || '일반회원',
      state: p.state || '정상',
    };
  });

  renderMembers();
}

function renderMembers(){
  const search = document.getElementById('memberSearch').value.trim().toLowerCase();
  const gradeFilter = document.getElementById('gradeFilter').value;
  const stateFilter = document.getElementById('memberStateFilter').value;

  let list = members;
  if(search) list = list.filter(m => m.name.toLowerCase().includes(search) || m.phone.includes(search));
  if(gradeFilter) list = list.filter(m => m.grade === gradeFilter);
  if(stateFilter) list = list.filter(m => m.state === stateFilter);

  document.getElementById('memberTbody').innerHTML = list.length ? list.map(m=>`
    <tr>
      <td>${m.name}</td><td>${m.phone}</td><td>${m.join}</td>
      <td>${m.orders}회</td><td>${won(m.total)}</td><td>${m.grade}</td>
      <td><span class="badge ${stateBadge[m.state]||'badge-gray'}">${m.state}</span></td>
      <td><button class="row-btn" onclick="openMemberDrawer('${m.id}')">상세보기</button></td>
    </tr>
  `).join('') : '<tr><td colspan="8" style="color:var(--muted); text-align:center; padding:30px;">회원이 없습니다.</td></tr>';
}
document.getElementById('memberSearch').addEventListener('input', renderMembers);
document.getElementById('gradeFilter').addEventListener('change', renderMembers);
document.getElementById('memberStateFilter').addEventListener('change', renderMembers);

let currentMemberId = null;
function openMemberDrawer(id){
  const m = members.find(x=>x.id===id);
  currentMemberId = id;
  document.getElementById('memberDrawerTitle').textContent = `회원 상세 · ${m.name}`;
  document.getElementById('memberInfo').innerHTML = `
    <div><span>이름</span><span>${m.name}</span></div>
    <div><span>연락처</span><span>${m.phone}</span></div>
    <div><span>가입일</span><span>${m.join}</span></div>
    <div><span>총 구매금액</span><span>${won(m.total)}</span></div>
  `;
  const userOrders = (ordersByUser[id]||[]).slice(0,5);
  document.getElementById('memberOrders').innerHTML = userOrders.length
    ? userOrders.map(o=>`<div class="mini-order-item"><span>${o.order_no}</span><span>${won(o.final_amount)}</span></div>`).join('')
    : '<p style="font-size:12.5px; color:var(--muted);">주문 내역이 없습니다.</p>';

  document.querySelectorAll('#gradePills .pill').forEach(p=>p.classList.toggle('selected', p.dataset.v===m.grade));
  document.querySelectorAll('#statePills .pill').forEach(p=>p.classList.toggle('selected', p.dataset.v===m.state));
  openDrawer('member');
}
document.getElementById('gradePills').addEventListener('click', (e)=>{
  const btn = e.target.closest('.pill'); if(!btn) return;
  document.querySelectorAll('#gradePills .pill').forEach(p=>p.classList.remove('selected'));
  btn.classList.add('selected');
});
document.getElementById('statePills').addEventListener('click', (e)=>{
  const btn = e.target.closest('.pill'); if(!btn) return;
  document.querySelectorAll('#statePills .pill').forEach(p=>p.classList.remove('selected'));
  btn.classList.add('selected');
});
document.getElementById('saveMemberBtn').addEventListener('click', async ()=>{
  const grade = document.querySelector('#gradePills .pill.selected')?.dataset.v || '일반회원';
  const state = document.querySelector('#statePills .pill.selected')?.dataset.v || '정상';
  const { error } = await window.sb.from('profiles').update({ grade, state }).eq('id', currentMemberId);
  if(error){ alert('저장에 실패했습니다: ' + error.message); return; }
  alert('회원 정보가 저장되었습니다.');
  closeDrawer('member');
  await loadMembers();
});

// ======================================================
// 리뷰관리
// ======================================================
let reviews = [];

async function loadReviews(){
  const { data, error } = await window.sb
    .from('reviews')
    .select('id, rating, content, visible, created_at, products(name), profiles(name)')
    .order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  reviews = data || [];
  renderReviews();
}

function renderReviews(){
  const search = document.getElementById('reviewSearch').value.trim().toLowerCase();
  const visibleFilter = document.getElementById('reviewVisibleFilter').value;

  let list = reviews;
  if(search) list = list.filter(r => (r.products?.name||'').toLowerCase().includes(search) || (r.profiles?.name||'').toLowerCase().includes(search));
  if(visibleFilter==='show') list = list.filter(r=>r.visible);
  if(visibleFilter==='hide') list = list.filter(r=>!r.visible);

  document.getElementById('reviewTbody').innerHTML = list.length ? list.map(r=>{
    const dateStr = r.created_at ? r.created_at.slice(0,10).replace(/-/g,'.') : '';
    return `
    <tr>
      <td class="cell-wrap">${r.products?.name || '-'}</td>
      <td>${r.profiles?.name || '회원'}</td>
      <td class="stars-mini">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</td>
      <td class="cell-wrap">${r.content || ''}</td>
      <td>${dateStr}</td>
      <td><span class="badge ${r.visible?'badge-green':'badge-gray'}">${r.visible?'노출':'숨김'}</span></td>
      <td><button class="row-btn" onclick="openReviewDrawer('${r.id}')">상세보기</button></td>
    </tr>
  `;
  }).join('') : '<tr><td colspan="7" style="color:var(--muted); text-align:center; padding:30px;">리뷰가 없습니다.</td></tr>';
}
document.getElementById('reviewSearch').addEventListener('input', renderReviews);
document.getElementById('reviewVisibleFilter').addEventListener('change', renderReviews);

let currentReviewId = null;
function openReviewDrawer(id){
  const r = reviews.find(x=>x.id===id);
  currentReviewId = id;
  document.getElementById('rv_prod').textContent = r.products?.name || '-';
  document.getElementById('rv_author').textContent = r.profiles?.name || '회원';
  document.getElementById('rv_stars').textContent = '★'.repeat(r.rating)+'☆'.repeat(5-r.rating);
  document.getElementById('rv_date').textContent = r.created_at ? r.created_at.slice(0,10).replace(/-/g,'.') : '';
  document.getElementById('rv_text').textContent = r.content || '';
  document.querySelectorAll('#reviewVisibilityPills .pill').forEach(p=>p.classList.toggle('selected', (p.dataset.v==='show')===r.visible));
  openDrawer('review');
}
document.getElementById('reviewVisibilityPills').addEventListener('click', (e)=>{
  const btn = e.target.closest('.pill'); if(!btn) return;
  document.querySelectorAll('#reviewVisibilityPills .pill').forEach(p=>p.classList.remove('selected'));
  btn.classList.add('selected');
});
document.getElementById('saveReviewBtn').addEventListener('click', async ()=>{
  const visible = document.querySelector('#reviewVisibilityPills .pill.selected')?.dataset.v === 'show';
  const { error } = await window.sb.from('reviews').update({ visible }).eq('id', currentReviewId);
  if(error){ alert('저장에 실패했습니다: ' + error.message); return; }
  alert('저장되었습니다.');
  closeDrawer('review');
  await loadReviews();
});
document.getElementById('deleteReviewBtn').addEventListener('click', async ()=>{
  if(!confirm('이 리뷰를 삭제하시겠습니까?')) return;
  const { error } = await window.sb.from('reviews').delete().eq('id', currentReviewId);
  if(error){ alert('삭제에 실패했습니다: ' + error.message); return; }
  alert('리뷰가 삭제되었습니다.');
  closeDrawer('review');
  await loadReviews();
});

// ======================================================
// 문의관리
// ======================================================
document.getElementById('inquirySubTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.sub-tab'); if(!btn) return;
  document.querySelectorAll('.sub-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('qnaSection').style.display = btn.dataset.t==='qna' ? 'block':'none';
  document.getElementById('csSection').style.display = btn.dataset.t==='cs' ? 'block':'none';
});

let qnaList = [];
let csList = [];

async function loadQna(){
  const { data, error } = await window.sb
    .from('product_questions')
    .select('id, content, secret, answer, created_at, products(name), profiles(name)')
    .order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  qnaList = data || [];
  renderQna();
}

function renderQna(){
  const search = document.getElementById('qnaSearch').value.trim().toLowerCase();
  const statusFilter = document.getElementById('qnaStatusFilter').value;

  let list = qnaList;
  if(search) list = list.filter(q => (q.products?.name||'').toLowerCase().includes(search) || (q.profiles?.name||'').toLowerCase().includes(search));
  if(statusFilter==='답변대기') list = list.filter(q=>!q.answer);
  if(statusFilter==='답변완료') list = list.filter(q=>!!q.answer);

  document.getElementById('qnaTbody').innerHTML = list.length ? list.map(q=>{
    const dateStr = q.created_at ? q.created_at.slice(0,10).replace(/-/g,'.') : '';
    const answered = !!q.answer;
    return `
    <tr>
      <td class="cell-wrap">${q.products?.name || '-'}</td>
      <td>${q.profiles?.name || '회원'}</td>
      <td class="cell-wrap">${q.secret ? '🔒 비밀글입니다.' : (q.content||'')}</td>
      <td>${dateStr}</td>
      <td>${q.secret ? 'Y' : '-'}</td>
      <td><span class="badge ${answered?'badge-green':'badge-red'}">${answered?'답변완료':'답변대기'}</span></td>
      <td><button class="row-btn" onclick="openAnswerDrawer('qna', '${q.id}')">${answered?'답변수정':'답변작성'}</button></td>
    </tr>
  `;
  }).join('') : '<tr><td colspan="7" style="color:var(--muted); text-align:center; padding:30px;">문의가 없습니다.</td></tr>';
}
document.getElementById('qnaSearch').addEventListener('input', renderQna);
document.getElementById('qnaStatusFilter').addEventListener('change', renderQna);

async function loadCs(){
  const { data, error } = await window.sb
    .from('customer_inquiries')
    .select('id, type, title, content, answer, status, created_at, profiles(name)')
    .order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  csList = data || [];
  renderCs();
}

function renderCs(){
  const search = document.getElementById('csSearch').value.trim().toLowerCase();
  const typeFilter = document.getElementById('csTypeFilter').value;

  let list = csList;
  if(search) list = list.filter(c => (c.title||'').toLowerCase().includes(search) || (c.profiles?.name||'').toLowerCase().includes(search));
  if(typeFilter) list = list.filter(c=>c.type===typeFilter);

  document.getElementById('csTbody').innerHTML = list.length ? list.map(c=>{
    const dateStr = c.created_at ? c.created_at.slice(0,10).replace(/-/g,'.') : '';
    const answered = c.status === '답변완료';
    return `
    <tr>
      <td>${c.type || '기타'}</td><td>${c.profiles?.name || '회원'}</td>
      <td class="cell-wrap">${c.title}</td><td>${dateStr}</td>
      <td><span class="badge ${answered?'badge-green':'badge-red'}">${c.status}</span></td>
      <td><button class="row-btn" onclick="openAnswerDrawer('cs', '${c.id}')">${answered?'답변수정':'답변작성'}</button></td>
    </tr>
  `;
  }).join('') : '<tr><td colspan="6" style="color:var(--muted); text-align:center; padding:30px;">문의가 없습니다.</td></tr>';
}
document.getElementById('csSearch').addEventListener('input', renderCs);
document.getElementById('csTypeFilter').addEventListener('change', renderCs);

let currentAnswerTarget = null;
function openAnswerDrawer(kind, id){
  currentAnswerTarget = {kind, id};
  if(kind==='qna'){
    const q = qnaList.find(x=>x.id===id);
    document.getElementById('answerDrawerTitle').textContent = '상품 Q&A 답변';
    document.getElementById('answerInfo').innerHTML = `
      <div><span>상품명</span><span>${q.products?.name || '-'}</span></div>
      <div><span>작성자</span><span>${q.profiles?.name || '회원'}</span></div>
    `;
    document.getElementById('answerQuestion').textContent = q.secret ? '🔒 비밀글로 작성된 문의입니다.' : (q.content||'');
    document.getElementById('answerText').value = q.answer || '';
  } else {
    const c = csList.find(x=>x.id===id);
    document.getElementById('answerDrawerTitle').textContent = '고객센터 문의 답변';
    document.getElementById('answerInfo').innerHTML = `
      <div><span>문의유형</span><span>${c.type || '기타'}</span></div>
      <div><span>작성자</span><span>${c.profiles?.name || '회원'}</span></div>
    `;
    document.getElementById('answerQuestion').textContent = c.title + (c.content ? ('\n\n' + c.content) : '');
    document.getElementById('answerText').value = c.answer || '';
  }
  openDrawer('answer');
}

document.getElementById('submitAnswerBtn').addEventListener('click', async ()=>{
  const answerText = document.getElementById('answerText').value.trim();
  if(!answerText){ alert('답변 내용을 입력해주세요.'); return; }
  const {kind, id} = currentAnswerTarget;

  if(kind==='qna'){
    const { error } = await window.sb.from('product_questions').update({ answer: answerText, answered_at: new Date().toISOString() }).eq('id', id);
    if(error){ alert('답변 등록에 실패했습니다: ' + error.message); return; }
    await loadQna();
  } else {
    const { error } = await window.sb.from('customer_inquiries').update({ answer: answerText, status: '답변완료' }).eq('id', id);
    if(error){ alert('답변 등록에 실패했습니다: ' + error.message); return; }
    await loadCs();
  }
  alert('답변이 등록되었습니다.');
  closeDrawer('answer');
});

// ---------- Init ----------
async function initPage(){
  const admin = await window.requireAdmin();
  if(!admin) return;
  await loadMembers();
  await loadReviews();
  await loadQna();
  await loadCs();
}
initPage();
</script>
</body>
</html>
