<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문관리 | 리브가전 관리자</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  :root{
    --main:#172033; --sub:#39445A; --bg:#F7F8FA; --point:#C83D3D;
    --text:#171717; --gray:#E9EBEF; --white:#FFFFFF; --muted:#7C8398;
    --radius:3px; --sidebar-w:230px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard','Noto Sans KR',sans-serif; color:var(--text); background:var(--bg); line-height:1.5;}
  img,svg{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}

  .admin-shell{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh;}
  .sidebar{background:var(--main); color:var(--white); padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .sidebar-logo{font-size:18px; font-weight:800; padding:0 24px 24px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:12px;}
  .sidebar-logo span{color:#F0A8A8;}
  .sidebar-logo small{display:block; font-size:11px; font-weight:500; color:#9AA1B4; margin-top:4px;}
  .nav-group{margin-bottom:6px;}
  .nav-group-label{font-size:11px; color:#7C839E; padding:14px 24px 6px; letter-spacing:0.02em;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:11px 24px; font-size:13.5px; font-weight:500; color:#C7CCDA;}
  .nav-item svg{width:17px; height:17px; flex-shrink:0;}
  .nav-item.active{background:rgba(255,255,255,0.08); color:var(--white); font-weight:700; border-right:3px solid #F0A8A8;}
  .nav-item:hover{color:var(--white);}

  .main{padding:28px 32px 60px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}
  .topbar h1{font-size:22px; font-weight:800;}

  /* Filters */
  .filter-bar{background:var(--white); border:1px solid var(--gray); border-radius:var(--radius); padding:16px 20px; margin-bottom:16px;}
  .filter-row{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
  .filter-row:last-child{margin-bottom:0;}
  .filter-bar input, .filter-bar select{padding:9px 12px; border:1px solid var(--gray); border-radius:var(--radius); font-size:13px; font-family:inherit;}
  .filter-bar input[type=text]{flex:1; min-width:180px;}
  .period-tabs{display:flex; gap:6px;}
  .period-tab{padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--muted); border:1px solid var(--gray); border-radius:99px;}
  .period-tab.active{background:var(--main); color:var(--white); border-color:var(--main);}
  .status-tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .status-tab{padding:8px 13px; font-size:12px; font-weight:600; color:var(--muted); border:1px solid var(--gray); border-radius:99px;}
  .status-tab.active{background:var(--main); color:var(--white); border-color:var(--main);}

  /* Table */
  .table-card{background:var(--white); border:1px solid var(--gray); border-radius:var(--radius); overflow-x:auto;}
  table{width:100%; border-collapse:collapse;}
  th, td{text-align:left; padding:13px 14px; font-size:13px; border-bottom:1px solid var(--gray); white-space:nowrap;}
  th{background:var(--bg); color:var(--muted); font-weight:600; font-size:12px;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--bg);}
  .order-no{font-weight:700;}
  .order-prod{max-width:200px; white-space:normal;}
  .badge{font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px;}
  .badge-blue{background:#EAF0FA; color:var(--sub);}
  .badge-red{background:#FDEDED; color:var(--point);}
  .badge-green{background:#EDF3EC; color:#2F7A45;}
  .badge-gray{background:var(--gray); color:var(--muted);}
  .row-detail-btn{padding:6px 12px; border:1px solid var(--gray); border-radius:var(--radius); font-size:11.5px; font-weight:600; color:var(--sub);}

  /* Drawer */
  .drawer-backdrop{display:none; position:fixed; inset:0; background:rgba(23,32,51,0.5); z-index:200;}
  .drawer-backdrop.open{display:block;}
  .order-drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(620px,92vw); background:var(--white); z-index:210;
    transform:translateX(100%); transition:transform .2s ease; overflow-y:auto;
  }
  .order-drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; padding:20px 28px; border-bottom:1px solid var(--gray); position:sticky; top:0; background:var(--white); z-index:5;}
  .drawer-head h2{font-size:16px; font-weight:800;}
  .drawer-close{font-size:13px; color:var(--muted);}
  .drawer-body{padding:24px 28px 40px;}

  .status-stepper{display:flex; justify-content:space-between; position:relative; margin-bottom:24px;}
  .status-stepper::before{content:''; position:absolute; top:9px; left:0; right:0; height:2px; background:var(--gray);}
  .step{position:relative; text-align:center; flex:1; font-size:10.5px; color:var(--muted);}
  .step .dot{width:18px; height:18px; border-radius:50%; background:var(--gray); margin:0 auto 8px; position:relative; z-index:1; border:3px solid var(--white);}
  .step.done .dot{background:var(--main);}
  .step.done{color:var(--main); font-weight:700;}

  .form-section{margin-bottom:28px;}
  .form-section h3{font-size:13.5px; font-weight:800; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--main); display:inline-block;}
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; font-size:13px;}
  .info-grid div span:first-child{color:var(--muted); display:block; font-size:11.5px; margin-bottom:3px;}
  .info-grid div span:last-child{font-weight:600;}

  .order-prod-item{display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--gray);}
  .order-prod-item:last-child{border-bottom:none;}
  .prod-thumb{width:52px; height:52px; background:var(--bg); border:1px solid var(--gray); border-radius:2px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .prod-thumb svg{width:55%; height:55%; color:var(--sub);}
  .prod-name{font-size:13.5px; font-weight:600;}
  .prod-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .pay-summary{background:var(--bg); border-radius:var(--radius); padding:14px 16px; font-size:13px;}
  .pay-row{display:flex; justify-content:space-between; margin-bottom:8px;}
  .pay-row:last-child{margin-bottom:0; padding-top:8px; border-top:1px solid var(--gray); font-weight:800; font-size:14px;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--sub); margin-bottom:6px;}
  .field input, .field select{width:100%; padding:10px 12px; border:1px solid var(--gray); border-radius:var(--radius); font-size:13px; font-family:inherit;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .status-change-row{display:flex; gap:8px; align-items:end;}
  .status-change-row .field{flex:1; margin-bottom:0;}
  .btn-apply{padding:10px 18px; background:var(--main); color:var(--white); border-radius:var(--radius); font-size:12.5px; font-weight:700; height:fit-content;}

  .history-log{font-size:12px; color:var(--muted);}
  .history-item{display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--gray);}
  .history-item:last-child{border-bottom:none;}
  .history-item .h-time{white-space:nowrap; color:#9AA1B4;}

  @media (max-width:900px){
    .admin-shell{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .info-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<script>
const CATEGORY_ICON_MAP = {
  '냉장고': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="2" width="14" height="20" rx="1.5"/><line x1="5" y1="10" x2="19" y2="10"/></svg>`,
  '세탁/건조': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="5"/></svg>`,
  'TV': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><line x1="8" y1="21" x2="16" y2="21"/></svg>`,
  '주방가전': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12c0-4 3.5-7 8-7s8 3 8 7"/><rect x="3" y="12" width="18" height="8" rx="1.5"/></svg>`,
  '생활가전': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="8" y="3" width="8" height="14" rx="3"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
};
const DEFAULT_ICON = CATEGORY_ICON_MAP['냉장고'];
const PAY_METHOD_LABEL = { card:'신용/체크카드', transfer:'계좌이체', virtual:'가상계좌', easy:'간편결제' };

const statusBadgeMap = {
  '결제대기':'badge-red', '결제완료':'badge-blue', '상품준비중':'badge-blue', '배송준비':'badge-blue',
  '배송중':'badge-blue', '배송완료':'badge-green', '구매확정':'badge-green',
  '취소':'badge-gray', '반품':'badge-gray', '교환':'badge-gray',
};
const stepperOrder = ['결제완료','상품준비중','배송준비','배송중','배송완료','구매확정'];

function won(n){ return (n||0).toLocaleString('ko-KR')+'원'; }

let orders = [];

function periodStart(key){
  const n = new Date();
  if(key==='today') return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if(key==='yesterday'){ const d = new Date(n.getFullYear(), n.getMonth(), n.getDate()); d.setDate(d.getDate()-1); return d; }
  if(key==='7d'){ const d = new Date(n); d.setDate(d.getDate()-7); return d; }
  if(key==='30d'){ const d = new Date(n); d.setDate(d.getDate()-30); return d; }
  return null;
}
function periodEnd(key){
  if(key==='yesterday'){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  return null;
}

async function loadOrders(){
  const { data, error } = await window.sb
    .from('orders')
    .select(`
      id, order_no, status, payment_method, final_amount, total_amount, discount_amount,
      receiver_name, receiver_phone, address, address_detail, request_note, created_at,
      user_id, profiles ( name, phone ),
      order_items ( qty, price, products ( name, categories(name) ), product_options ( option_value ) ),
      payments ( method, status, paid_at ),
      shipments ( id, carrier, tracking_no, status )
    `)
    .order('created_at', { ascending:false })
    .limit(500);

  if(error){ console.error(error); return; }
  orders = data || [];
  renderOrders();
}

function matchesFilters(o){
  const statusFilter = document.querySelector('.status-tab.active')?.dataset.s || 'all';
  const periodFilter = document.querySelector('.period-tab.active')?.dataset.p || 'today';
  const payFilter = document.getElementById('paymentFilter').value;
  const search = document.getElementById('searchInput').value.trim().toLowerCase();

  if(statusFilter!=='all' && o.status!==statusFilter) return false;
  if(payFilter && o.payment_method!==payFilter) return false;

  if(periodFilter!=='all'){
    const start = periodStart(periodFilter);
    const end = periodEnd(periodFilter);
    const created = new Date(o.created_at);
    if(start && created < start) return false;
    if(end && created >= end) return false;
  }

  if(search){
    const itemNames = (o.order_items||[]).map(i=>i.products?.name||'').join(' ').toLowerCase();
    const hay = `${o.order_no} ${o.profiles?.name||''} ${o.receiver_name||''} ${o.receiver_phone||''} ${itemNames}`.toLowerCase();
    if(!hay.includes(search)) return false;
  }
  return true;
}

function renderOrders(){
  const list = orders.filter(matchesFilters);
  document.getElementById('orderTbody').innerHTML = list.length ? list.map(o=>{
    const cls = statusBadgeMap[o.status] || 'badge-gray';
    const items = o.order_items || [];
    const prodSummary = items.length ? `${items[0].products?.name || '상품'}${items.length>1 ? ` 외 ${items.length-1}건` : ''}` : '-';
    const dateStr = o.created_at ? o.created_at.slice(0,10).replace(/-/g,'.') : '';
    return `
    <tr class="clickable" onclick="openDrawer('${o.id}')">
      <td class="order-no">${o.order_no}</td>
      <td>${dateStr}</td>
      <td>${o.profiles?.name || o.receiver_name || '-'}</td>
      <td>${o.receiver_phone || '-'}</td>
      <td class="order-prod">${prodSummary}</td>
      <td>${won(o.final_amount)}</td>
      <td><span class="badge ${cls}">${o.status}</span></td>
      <td><button class="row-detail-btn" onclick="event.stopPropagation(); openDrawer('${o.id}')">상세보기</button></td>
    </tr>
  `;
  }).join('') : '<tr><td colspan="8" style="color:var(--muted); text-align:center; padding:30px;">해당 조건의 주문이 없습니다.</td></tr>';
}

document.getElementById('statusTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.status-tab');
  if(!btn) return;
  document.querySelectorAll('.status-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
});
document.getElementById('periodTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.period-tab');
  if(!btn) return;
  document.querySelectorAll('.period-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
});
document.getElementById('paymentFilter').addEventListener('change', renderOrders);
document.getElementById('searchInput').addEventListener('input', renderOrders);

// ---------- Drawer ----------
const drawer = document.getElementById('orderDrawer');
const backdrop = document.getElementById('drawerBackdrop');
let currentOrderId = null;

function renderStepper(status){
  const steps = document.getElementById('statusStepper').querySelectorAll('.step');
  const idx = stepperOrder.indexOf(status);
  steps.forEach((s,i)=> s.classList.toggle('done', idx>=0 && i<=idx));
}

function openDrawer(orderId){
  const o = orders.find(x=>x.id===orderId);
  if(!o) return;
  currentOrderId = orderId;

  document.getElementById('drawerOrderNo').textContent = `주문상세 · ${o.order_no}`;
  document.getElementById('statusSelect').value = o.status;
  renderStepper(o.status);

  document.getElementById('ordererInfo').innerHTML = `
    <div><span>이름</span><span>${o.profiles?.name || o.receiver_name || '-'}</span></div>
    <div><span>연락처</span><span>${o.profiles?.phone || o.receiver_phone || '-'}</span></div>
    <div><span>결제수단</span><span>${PAY_METHOD_LABEL[o.payment_method] || o.payment_method || '-'}</span></div>
  `;

  document.getElementById('shippingInfo').innerHTML = `
    <div><span>수령인</span><span>${o.receiver_name || '-'}</span></div>
    <div><span>연락처</span><span>${o.receiver_phone || '-'}</span></div>
    <div style="grid-column:1/-1;"><span>주소</span><span>${o.address || ''} ${o.address_detail || ''}</span></div>
    <div style="grid-column:1/-1;"><span>요청사항</span><span>${o.request_note || '-'}</span></div>
  `;

  const shipment = (o.shipments||[])[0];
  document.getElementById('f_carrier').value = shipment?.carrier || '리브로지스틱스';
  document.getElementById('f_tracking').value = shipment?.tracking_no || '';

  const items = o.order_items || [];
  document.getElementById('orderProdList').innerHTML = items.length ? items.map(item=>{
    const icon = CATEGORY_ICON_MAP[item.products?.categories?.name] || DEFAULT_ICON;
    const opt = item.product_options?.option_value ? `${item.product_options.option_value} · ` : '';
    return `
      <div class="order-prod-item">
        <div class="prod-thumb">${icon}</div>
        <div>
          <div class="prod-name">${item.products?.name || '상품'}</div>
          <div class="prod-meta">${opt}${item.qty}개 · ${won(item.price)}</div>
        </div>
      </div>`;
  }).join('') : '<p style="color:var(--muted); font-size:13px;">주문상품 정보가 없습니다.</p>';

  document.getElementById('paySummary').innerHTML = `
    <div class="pay-row"><span>상품금액</span><span>${won(o.total_amount)}</span></div>
    <div class="pay-row"><span>할인금액</span><span style="color:var(--point);">-${won(o.discount_amount)}</span></div>
    <div class="pay-row"><span>배송비</span><span>무료</span></div>
    <div class="pay-row"><span>최종 결제금액</span><span>${won(o.final_amount)}</span></div>
  `;

  document.getElementById('historyLog').innerHTML = '<p style="color:var(--muted);">이 창을 연 이후 변경한 내역이 여기 표시됩니다.</p>';

  drawer.classList.add('open');
  backdrop.classList.add('open');
}
function closeDrawer(){
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
}
document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
backdrop.addEventListener('click', closeDrawer);

document.getElementById('applyStatusBtn').addEventListener('click', async ()=>{
  const o = orders.find(x=>x.id===currentOrderId);
  if(!o) return;
  const newStatus = document.getElementById('statusSelect').value;
  const oldStatus = o.status;
  const carrier = document.getElementById('f_carrier').value;
  const trackingNo = document.getElementById('f_tracking').value.trim();

  const btn = document.getElementById('applyStatusBtn');
  btn.disabled = true;

  const { error: orderErr } = await window.sb.from('orders').update({ status: newStatus }).eq('id', currentOrderId);
  if(orderErr){ alert('상태 변경에 실패했습니다: ' + orderErr.message); btn.disabled = false; return; }

  if(trackingNo){
    const existingShipment = (o.shipments||[])[0];
    if(existingShipment){
      await window.sb.from('shipments').update({ carrier, tracking_no: trackingNo, status: newStatus }).eq('id', existingShipment.id);
    } else {
      await window.sb.from('shipments').insert({ order_id: currentOrderId, carrier, tracking_no: trackingNo, status: newStatus });
    }
  }

  o.status = newStatus;
  renderStepper(newStatus);

  const now = new Date();
  const timeStr = `${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const log = document.createElement('div');
  log.className = 'history-item';
  log.innerHTML = `<span class="h-time">${timeStr}</span><span>${oldStatus} → ${newStatus}</span>`;
  const historyLog = document.getElementById('historyLog');
  if(historyLog.querySelector('p')) historyLog.innerHTML = '';
  historyLog.prepend(log);

  btn.disabled = false;
  renderOrders();
  alert(`주문상태가 '${newStatus}'(으)로 변경되었습니다.`);
});

// ---------- Init ----------
async function initPage(){
  const admin = await window.requireAdmin();
  if(!admin) return;
  await loadOrders();
}
initPage();
</script>
